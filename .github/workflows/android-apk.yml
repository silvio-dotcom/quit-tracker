name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons

      - name: Prepare Android SDK (ubuntu preinstalled)
        run: bash scripts/prepare-android-sdk.sh

      - name: Ensure debug keystore
        run: bash scripts/generate-debug-keystore.sh

      - name: Capacitor sync
        run: npm run cap:sync

      - name: Android launcher icons
        run: npm run icons:android

      - name: Assemble debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
        env:
          QT_KEYSTORE_PATH: ${{ github.workspace }}/android/quit-tracker-debug.keystore
          QT_KEYSTORE_PASSWORD: quittracker
          QT_KEY_ALIAS: quittracker
          QT_KEY_PASSWORD: quittracker

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk quit-tracker.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: quit-tracker-apk
          path: quit-tracker.apk

      - name: Publish to latest-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=latest-apk
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Latest Android APK (debug)" --notes "Personal sideload build from main. Overwritten on each CI run."
          fi
          gh release upload "$tag" quit-tracker.apk --clobber
